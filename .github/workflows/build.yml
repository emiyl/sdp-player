name: Cross-platform build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os-name }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os-name: windows
            arch: x64
            runner: ubuntu-latest
            triplet: x64-mingw-static
            compiler: x86_64-w64-mingw32-gcc
            cxx_compiler: x86_64-w64-mingw32-g++
          - os-name: windows
            arch: arm64
            runner: ubuntu-latest
            triplet: arm64-mingw-static
            compiler: aarch64-w64-mingw32-gcc
            cxx_compiler: aarch64-w64-mingw32-g++
          - os-name: macos
            arch: arm64
            runner: macos-latest
          - os-name: linux
            arch: x64
            runner: ubuntu-latest
          - os-name: linux
            arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Cache Linux apt packages
        if: matrix.os-name == 'linux' || matrix.os-name == 'windows'
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt/archives
            /var/lib/apt/lists
          key: apt-${{ matrix.os-name }}-${{ matrix.arch }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Cache macOS Homebrew downloads
        if: matrix.os-name == 'macos'
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            ~/Library/Caches/Homebrew/downloads
          key: brew-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            brew-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Windows package dependencies
        if: matrix.os-name == 'windows'
        uses: actions/cache@v4
        with:
          path: |
            /tmp/vcpkg-binary-cache
            /usr/local/share/vcpkg/downloads
            /usr/local/share/vcpkg/installed
          key: windows-packages-${{ matrix.arch }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            windows-packages-${{ matrix.arch }}-

      - name: Install Linux dependencies
        if: matrix.os-name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            pkg-config \
            libsdl2-dev \
            libavformat-dev \
            libavcodec-dev \
            libavutil-dev \
            libswscale-dev \
            libswresample-dev

      - name: Install macOS dependencies
        if: matrix.os-name == 'macos'
        run: |
          brew update
          brew install cmake ninja pkg-config sdl2 ffmpeg

      - name: Install Windows dependencies
        if: matrix.os-name == 'windows'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build pkg-config zip \
            gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 \
            gcc-mingw-w64-aarch64 g++-mingw-w64-aarch64
          if [ ! -x /usr/local/share/vcpkg/vcpkg ]; then
            git clone --depth 1 https://github.com/microsoft/vcpkg.git /tmp/vcpkg
            /tmp/vcpkg/bootstrap-vcpkg.sh
            sudo mv /tmp/vcpkg /usr/local/share/vcpkg
          fi
          export VCPKG_BINARY_SOURCES="clear;files,/tmp/vcpkg-binary-cache,readwrite"
          mkdir -p /tmp/vcpkg-binary-cache
          /usr/local/share/vcpkg/vcpkg install \
            sdl2 ffmpeg --triplet "${{ matrix.triplet }}"

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: build
          key: build-${{ matrix.os-name }}-${{ matrix.arch }}-${{ hashFiles('CMakeLists.txt', 'src/**') }}
          restore-keys: |
            build-${{ matrix.os-name }}-${{ matrix.arch }}-

      - name: Configure Linux
        if: matrix.os-name == 'linux'
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Configure macOS
        if: matrix.os-name == 'macos'
        run: |
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            cmake -S . -B build \
              -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_OSX_ARCHITECTURES=arm64
          else
            cmake -S . -B build \
              -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_OSX_ARCHITECTURES=x86_64
          fi

      - name: Configure Windows
        if: matrix.os-name == 'windows'
        run: |
          export PKG_CONFIG_PATH="/usr/local/share/vcpkg/installed/${{ matrix.triplet }}/lib/pkgconfig"
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER="${{ matrix.compiler }}" \
            -DCMAKE_CXX_COMPILER="${{ matrix.cxx_compiler }}" \
            -DCMAKE_TOOLCHAIN_FILE="/usr/local/share/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET="${{ matrix.triplet }}"

      - name: Build
        run: cmake --build build --config Release

      - name: Package Linux
        if: matrix.os-name == 'linux'
        run: |
          mkdir -p dist
          cp build/sdp-player dist/sdp-player
          tar -czf "sdp-player-linux-${{ matrix.arch }}.tar.gz" -C dist .

      - name: Package macOS
        if: matrix.os-name == 'macos'
        run: |
          mkdir -p dist
          cp build/sdp-player dist/sdp-player
          tar -czf "sdp-player-macos-${{ matrix.arch }}.tar.gz" -C dist .

      - name: Package Windows
        if: matrix.os-name == 'windows'
        run: |
          mkdir -p dist
          cp build/sdp-player.exe dist/sdp-player.exe
          zip -r "sdp-player-windows-${{ matrix.arch }}.zip" dist

      - name: Upload Linux artifact
        if: matrix.os-name == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: sdp-player-linux-${{ matrix.arch }}
          path: sdp-player-linux-${{ matrix.arch }}.tar.gz

      - name: Upload macOS artifact
        if: matrix.os-name == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: sdp-player-macos-${{ matrix.arch }}
          path: sdp-player-macos-${{ matrix.arch }}.tar.gz

      - name: Upload Windows artifact
        if: matrix.os-name == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: sdp-player-windows-${{ matrix.arch }}
          path: sdp-player-windows-${{ matrix.arch }}.zip
