name: Cross-platform build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-switch1:
    name: Nintendo Switch 1
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Switch 1 dependencies
        run: |
          dkp-pacman -Syu --needed --noconfirm \
            switch-dev \
            switch-tools \
            switch-sdl2 \
            switch-ffmpeg \
            switch-bzip2 \
            switch-zlib

      - name: Configure and build
        run: |
          cmake --preset switch1
          cmake --build --preset switch1

      - name: Upload Nintendo Switch 1 artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdp-player-switch1
          path: build-switch1/sdp-player.nro

  build-switch2:
    name: Nintendo Switch 2
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest

    steps:
      - uses: actions/checkout@v4

      - name: Install ounce-devkit
        run: |
          dkp-pacman -Syu --needed --noconfirm \
            switch-dev \
            switch-tools \
            switch-sdl2 \
            switch-ffmpeg \
            switch-bzip2 \
            switch-zlib
          curl -fsSL \
            https://raw.githubusercontent.com/ouncebrew/ounce-devkit/main/install.sh \
            -o /tmp/ounce-install.sh
          sh /tmp/ounce-install.sh

      - name: Configure and build
        run: |
          cmake --preset switch2
          cmake --build --preset switch2

      - name: Upload Nintendo Switch 2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdp-player-switch2
          path: build-switch2/sdp-player.nro

  build:
    name: ${{ matrix.os-name }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os-name: windows
            arch: x64
            runner: windows-latest
            triplet: x64-windows-static
          - os-name: windows
            arch: arm64
            runner: windows-11-arm
            triplet: arm64-windows-static
          - os-name: macos
            arch: arm64
            runner: macos-latest
          - os-name: linux
            arch: x64
            runner: ubuntu-latest
          - os-name: linux
            arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Cache Linux apt packages
        if: matrix.os-name == 'linux' || matrix.os-name == 'windows'
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt/archives
            /var/lib/apt/lists
          key: apt-${{ matrix.os-name }}-${{ matrix.arch }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Cache macOS Homebrew downloads
        if: matrix.os-name == 'macos'
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            ~/Library/Caches/Homebrew/downloads
          key: brew-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            brew-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Windows package dependencies
        if: matrix.os-name == 'windows'
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg-binary-cache
            C:\vcpkg\downloads
            C:\vcpkg\installed
          key: windows-packages-${{ matrix.arch }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            windows-packages-${{ matrix.arch }}-

      - name: Install Linux dependencies
        if: matrix.os-name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            pkg-config \
            libsdl2-dev \
            libavformat-dev \
            libavcodec-dev \
            libavutil-dev \
            libswscale-dev \
            libswresample-dev \
            libbz2-dev \
            liblzma-dev

      - name: Install macOS dependencies
        if: matrix.os-name == 'macos'
        run: |
          brew update
          brew install cmake ninja pkg-config sdl2 ffmpeg

      - name: Install Windows dependencies
        if: matrix.os-name == 'windows'
        shell: pwsh
        run: |
          $components = @(
            "--add", "Microsoft.VisualStudio.Workload.VCTools",
            "--add", "Microsoft.VisualStudio.Component.Windows11SDK.26100",
            "--includeRecommended"
          )
          if ("${{ matrix.arch }}" -eq "arm64") {
            $components += @(
              "--add", "Microsoft.VisualStudio.Component.VC.Tools.ARM64",
              "--add", "Microsoft.VisualStudio.Component.VC.Tools.ARM64EC"
            )
          }
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          if (Test-Path $installer) {
            Start-Process -FilePath $installer `
              -ArgumentList (@("modify", "--installPath", "C:\VS", "--quiet", "--norestart") + $components) `
              -Wait
          } else {
            $bootstrapper = "$env:TEMP\vs_buildtools.exe"
            Invoke-WebRequest `
              -Uri "https://aka.ms/vs/17/release/vs_buildtools.exe" `
              -OutFile $bootstrapper
            Start-Process -FilePath $bootstrapper `
              -ArgumentList (@("--quiet", "--wait", "--norestart", "--nocache") + $components) `
              -Wait
          }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64
          $vcpkg = "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe"
          if (-not (Test-Path $vcpkg)) {
            $vcpkg = "C:\vcpkg\vcpkg.exe"
          }
          New-Item -ItemType Directory -Force C:\vcpkg-binary-cache | Out-Null
          $env:VCPKG_BINARY_SOURCES = "clear;files,C:\vcpkg-binary-cache,readwrite"
          & $vcpkg install sdl2 ffmpeg --triplet "${{ matrix.triplet }}"

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: build
          key: cmake-build-${{ matrix.os-name }}-${{ matrix.arch }}-${{ hashFiles('CMakeLists.txt', 'src/**') }}
          restore-keys: |
            cmake-build-${{ matrix.os-name }}-${{ matrix.arch }}-

      - name: Configure Linux
        if: matrix.os-name == 'linux'
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Configure macOS
        if: matrix.os-name == 'macos'
        run: |
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            cmake -S . -B build \
              -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_OSX_ARCHITECTURES=arm64
          else
            cmake -S . -B build \
              -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_OSX_ARCHITECTURES=x86_64
          fi

      - name: Configure Windows
        if: matrix.os-name == 'windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $instance = & $vswhere -latest -property installationPath
          if (-not $instance) {
            throw "Visual Studio C++ Build Tools were not found"
          }
          $vcvars = Join-Path $instance "VC\Auxiliary\Build\vcvarsall.bat"
          if (-not (Test-Path $vcvars)) {
            throw "vcvarsall.bat was not found at $vcvars"
          }
          $triplet = "${{ matrix.triplet }}"
          $vcpkg = "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe"
          if (-not (Test-Path $vcpkg)) {
            $vcpkg = "C:\vcpkg\vcpkg.exe"
          }
          $root = Split-Path -Parent $vcpkg
          $platform = "${{ matrix.arch }}"
          $staticLibDir = "$root\installed\${{ matrix.triplet }}\lib"
          if (-not (Test-Path "$staticLibDir\SDL2-static.lib")) {
            throw "Static SDL2 library was not found at $staticLibDir"
          }
          foreach ($lib in @("avformat.lib", "avcodec.lib", "avutil.lib", "swscale.lib", "swresample.lib")) {
            if (-not (Test-Path "$staticLibDir\$lib")) {
              throw "Static FFmpeg library $lib was not found at $staticLibDir"
            }
          }
          $vcarch = if ($platform -eq "arm64") { "arm64" } else { "x64" }
          $env:VCPKG_INSTALLED_DIR = "$root\installed"
          $env:VCPKG_TARGET_TRIPLET = $triplet
          cmd /d /c "`"$vcvars`" $vcarch && set VCPKG_INSTALLED_DIR=$root\installed && set VCPKG_TARGET_TRIPLET=$triplet && cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=`"$root\scripts\buildsystems\vcpkg.cmake`" -DVCPKG_TARGET_TRIPLET=$triplet -DVCPKG_INSTALLED_DIR=`"$root\installed`""

      - name: Build Windows
        if: matrix.os-name == 'windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $instance = & $vswhere -latest -property installationPath
          $vcvars = Join-Path $instance "VC\Auxiliary\Build\vcvarsall.bat"
          $vcarch = if ("${{ matrix.arch }}" -eq "arm64") { "arm64" } else { "x64" }
          cmd /d /c "`"$vcvars`" $vcarch && cmake --build build --config Release"

      - name: Build Unix
        if: matrix.os-name != 'windows'
        run: cmake --build build --config Release

      - name: Package Linux
        if: matrix.os-name == 'linux'
        run: |
          mkdir -p dist
          cp build/sdp-player dist/sdp-player
          tar -czf "sdp-player-linux-${{ matrix.arch }}.tar.gz" -C dist .

      - name: Package macOS
        if: matrix.os-name == 'macos'
        run: |
          mkdir -p dist
          cp build/sdp-player dist/sdp-player
          tar -czf "sdp-player-macos-${{ matrix.arch }}.tar.gz" -C dist .

      - name: Package Windows
        if: matrix.os-name == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $binary = "build\sdp-player.exe"
          if (Test-Path "build\Release\sdp-player.exe") {
            $binary = "build\Release\sdp-player.exe"
          }
          Copy-Item $binary "dist\sdp-player.exe"
          Compress-Archive -Path dist\* -DestinationPath "sdp-player-windows-${{ matrix.arch }}.zip"

      - name: Upload Linux artifact
        if: matrix.os-name == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: sdp-player-linux-${{ matrix.arch }}
          path: sdp-player-linux-${{ matrix.arch }}.tar.gz

      - name: Upload macOS artifact
        if: matrix.os-name == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: sdp-player-macos-${{ matrix.arch }}
          path: sdp-player-macos-${{ matrix.arch }}.tar.gz

      - name: Upload Windows artifact
        if: matrix.os-name == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: sdp-player-windows-${{ matrix.arch }}
          path: sdp-player-windows-${{ matrix.arch }}.zip
