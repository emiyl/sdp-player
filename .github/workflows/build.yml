name: Cross-platform build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os-name }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os-name: windows
            arch: x64
            runner: windows-latest
            triplet: x64-windows
          - os-name: windows
            arch: arm64
            runner: windows-latest
            triplet: arm64-windows
            generator: Visual Studio 17 2022
          - os-name: macos
            arch: arm64
            runner: macos-latest
          - os-name: linux
            arch: x64
            runner: ubuntu-latest
          - os-name: linux
            arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Cache Linux apt packages
        if: matrix.os-name == 'linux'
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt/archives
            /var/lib/apt/lists
          key: apt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Cache macOS Homebrew downloads
        if: matrix.os-name == 'macos'
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            ~/Library/Caches/Homebrew/downloads
          key: brew-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            brew-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Windows package dependencies
        if: matrix.os-name == 'windows'
        uses: actions/cache@v4
        with:
          path: |
            C:\ProgramData\chocolatey\lib\pkgconfiglite
            C:\ProgramData\chocolatey\cache
            C:\vcpkg-binary-cache
            C:\vcpkg\downloads
            C:\vcpkg\installed
          key: windows-packages-${{ matrix.arch }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            windows-packages-${{ matrix.arch }}-

      - name: Install Linux dependencies
        if: matrix.os-name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            pkg-config \
            libsdl2-dev \
            libavformat-dev \
            libavcodec-dev \
            libavutil-dev \
            libswscale-dev \
            libswresample-dev

      - name: Install macOS dependencies
        if: matrix.os-name == 'macos'
        run: |
          brew update
          brew install cmake ninja pkg-config sdl2 ffmpeg

      - name: Install Windows dependencies
        if: matrix.os-name == 'windows'
        shell: pwsh
        run: |
          choco install pkgconfiglite -y
          $vcpkg = $null
          $candidates = @(
            "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe",
            "$env:VCPKG_ROOT\vcpkg.exe",
            "C:\vcpkg\vcpkg.exe",
            "C:\src\vcpkg\vcpkg.exe"
          )
          foreach ($candidate in $candidates) {
            if ($candidate -and (Test-Path $candidate)) {
              $vcpkg = $candidate
              break
            }
          }
          if (-not $vcpkg) {
            git clone --depth 1 https://github.com/microsoft/vcpkg.git C:\vcpkg
            & C:\vcpkg\bootstrap-vcpkg.bat
            $vcpkg = "C:\vcpkg\vcpkg.exe"
          }
          New-Item -ItemType Directory -Force C:\vcpkg-binary-cache | Out-Null
          $env:VCPKG_BINARY_SOURCES = "clear;files,C:\vcpkg-binary-cache,readwrite"
          & $vcpkg install sdl2 ffmpeg --triplet "${{ matrix.triplet }}"

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: build
          key: build-${{ matrix.os-name }}-${{ matrix.arch }}-${{ hashFiles('CMakeLists.txt', 'src/**') }}
          restore-keys: |
            build-${{ matrix.os-name }}-${{ matrix.arch }}-

      - name: Configure Linux
        if: matrix.os-name == 'linux'
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Configure macOS
        if: matrix.os-name == 'macos'
        run: |
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            cmake -S . -B build \
              -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_OSX_ARCHITECTURES=arm64
          else
            cmake -S . -B build \
              -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_OSX_ARCHITECTURES=x86_64
          fi

      - name: Configure Windows
        if: matrix.os-name == 'windows'
        shell: pwsh
        run: |
          $triplet = "${{ matrix.triplet }}"
          $vcpkg = "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe"
          if (-not (Test-Path $vcpkg)) {
            $vcpkg = "$env:VCPKG_ROOT\vcpkg.exe"
          }
          if (-not (Test-Path $vcpkg)) {
            $vcpkg = "C:\vcpkg\vcpkg.exe"
          }
          $root = Split-Path -Parent $vcpkg
          $prefix = "$root\installed\$triplet"
          $env:PKG_CONFIG_PATH = "$prefix\lib\pkgconfig;$prefix\share\pkgconfig"
          $platform = "${{ matrix.arch }}"
          cmake -S . -B build `
            -G "Visual Studio 17 2022" `
            -A $platform `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$root\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET="$triplet"

      - name: Build
        run: cmake --build build --config Release

      - name: Package Linux
        if: matrix.os-name == 'linux'
        run: |
          mkdir -p dist
          cp build/sdp-player dist/sdp-player
          tar -czf "sdp-player-linux-${{ matrix.arch }}.tar.gz" -C dist .

      - name: Package macOS
        if: matrix.os-name == 'macos'
        run: |
          mkdir -p dist
          cp build/sdp-player dist/sdp-player
          tar -czf "sdp-player-macos-${{ matrix.arch }}.tar.gz" -C dist .

      - name: Package Windows
        if: matrix.os-name == 'windows'
        shell: pwsh
        run: |
          $triplet = "${{ matrix.triplet }}"
          $vcpkg = "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe"
          if (-not (Test-Path $vcpkg)) {
            $vcpkg = "$env:VCPKG_ROOT\vcpkg.exe"
          }
          if (-not (Test-Path $vcpkg)) {
            $vcpkg = "C:\vcpkg\vcpkg.exe"
          }
          $root = Split-Path -Parent $vcpkg
          $prefix = "$root\installed\$triplet"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "build\Release\sdp-player.exe" "dist\sdp-player.exe"
          Get-ChildItem "$prefix\bin\*.dll" -ErrorAction SilentlyContinue |
            Copy-Item -Destination dist
          Compress-Archive -Path dist\* -DestinationPath "sdp-player-windows-${{ matrix.arch }}.zip"

      - name: Upload Linux artifact
        if: matrix.os-name == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: sdp-player-linux-${{ matrix.arch }}
          path: sdp-player-linux-${{ matrix.arch }}.tar.gz

      - name: Upload macOS artifact
        if: matrix.os-name == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: sdp-player-macos-${{ matrix.arch }}
          path: sdp-player-macos-${{ matrix.arch }}.tar.gz

      - name: Upload Windows artifact
        if: matrix.os-name == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: sdp-player-windows-${{ matrix.arch }}
          path: sdp-player-windows-${{ matrix.arch }}.zip
